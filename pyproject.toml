[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwall"
version = "0.1.0"
description = "Microsegmentation, automatic threat blocking and layered misalignment monitoring for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-security", "agents", "microsegmentation", "zero-trust", "llm", "ai-agents", "misalignment", "egress"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Environment :: Console"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentwall = "agentwall.cli:main"

[project.urls]
Homepage = "https://github.com/Krish31595/agentwall"

[tool.setuptools]
packages = ["agentwall"]

[tool.setuptools.package-data]
agentwall = ["example_policy.toml"]
